<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registrar mascota - App de Mascotas</title>
 <link rel="stylesheet" href="styleRegitro.css">
</head>
<body>
<button class="btn-regresar" onclick="window.location.href='index.html'">↩️</button>
<div class="contenedor">
    <h1>Registrar mascota</h1>
    <form id="formulario-registro" enctype="multipart/form-data">
        <h2>Propietario</h2>
        <div class="campo">
            <label for="propietarioNombre">Nombre</label>
            <input id="propietarioNombre" name="propietarioNombre" type="text" required>
        </div>
        <div class="campo">
            <label for="propietarioTelefono">Teléfono</label>
            <input id="propietarioTelefono" name="propietarioTelefono" type="tel" required>
        </div>
        <h2>Mascota</h2>
        <div class="campo">
            <label for="mascotaNombre">Nombre</label>
            <input id="mascotaNombre" name="mascotaNombre" type="text" required>
        </div>
        <div class="campo">
            <label for="mascotaDescripcion">Descripción</label>
            <textarea id="mascotaDescripcion" name="mascotaDescripcion" required></textarea>
        </div>
        <div class="campo">
            <label for="razaCode">Raza</label>
            <select id="razaCode" name="razaCode" required>
                <option value="">Cargando razas...</option>
            </select>
        </div>
        <div class="campo">
            <label for="imagen">Imagen de la mascota</label>
            <input id="imagen" name="imagen" type="file" accept="image/*" required>
        </div>
        <h2>Publicación</h2>
        <div class="campo">
            <label for="publicidadDescripcion">Descripción del aviso</label>
            <textarea id="publicidadDescripcion" name="publicidadDescripcion" required></textarea>
        </div>
        <div class="campo">
            <label for="recompensa">Recompensa</label>
            <input id="recompensa" name="recompensa" type="number" min="0" step="0.01">
        </div>
        <div class="campo">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>
        </div>
        
        <div class="botones-contenedor">
            <button type="button" class="btn-registrar" onclick="registrarPublicidad()">REGISTRAR</button>
        </div>
        
        <p id="mensaje-registro" class="mensaje" aria-live="polite"></p>
    </form>
</div>
<script src="app.js"></script>
<script>
// 🔧 FUNCIONAMIENTO — sin tocar tu HTML
document.addEventListener('DOMContentLoaded', function () {
    // Lista de razas comunes en Bolivia
    const razas = [
        { valor: 'criollo', texto: 'Criollo / Mestizo' },
        { valor: 'labrador', texto: 'Labrador' },
        { valor: 'pastor_aleman', texto: 'Pastor Alemán' },
        { valor: 'chihuahua', texto: 'Chihuahua' },
        { valor: 'golden_retriever', texto: 'Golden Retriever' },
        { valor: 'bulldog', texto: 'Bulldog' },
        { valor: 'poodle', texto: 'Caniche / Poodle' },
        { valor: 'dogo', texto: 'Dogo Argentino' },
        { valor: 'beagle', texto: 'Beagle' },
        { valor: 'otro', texto: 'Otra raza' }
    ];

    // Cargar razas en el select
    const selectRaza = document.getElementById('razaCode');
    if (selectRaza) {
        selectRaza.innerHTML = '<option value="">Seleccione una raza...</option>';
        razas.forEach(r => {
            const op = document.createElement('option');
            op.value = r.valor;
            op.textContent = r.texto;
            selectRaza.appendChild(op);
        });
    }

    // Bloquear fechas futuras
    const campoFecha = document.getElementById('fecha');
    const hoy = new Date().toISOString().split('T')[0];
    campoFecha.max = hoy;
});

// ✅ Función que llama tu botón — MANTENGO TU NOMBRE ORIGINAL
function registrarPublicidad() {
    const mensaje = document.getElementById('mensaje-registro');
    
    // Recopilar todos los campos
    const nombre = document.getElementById('propietarioNombre').value.trim();
    const telefono = document.getElementById('propietarioTelefono').value.trim();
    const nombreMascota = document.getElementById('mascotaNombre').value.trim();
    const descripcionMascota = document.getElementById('mascotaDescripcion').value.trim();
    const raza = document.getElementById('razaCode').value;
    const imagen = document.getElementById('imagen').files[0];
    const descripcionAviso = document.getElementById('publicidadDescripcion').value.trim();
    const fecha = document.getElementById('fecha').value;

    // Validaciones
    if (!nombre || !telefono || !nombreMascota || !descripcionMascota || !raza || !imagen || !descripcionAviso || !fecha) {
        mensaje.textContent = '⚠️ Completa todos los campos obligatorios';
        mensaje.className = 'mensaje error';
        return;
    }
    if (telefono.length < 7) {
        mensaje.textContent = '⚠️ El teléfono debe tener al menos 7 dígitos';
        mensaje.className = 'mensaje error';
        return;
    }

    // ✅ Todo correcto — recolectar datos
    const formData = new FormData(document.getElementById('formulario-registro'));
    const datos = Object.fromEntries(formData.entries());
    datos.imagenArchivo = imagen?.name || 'Sin imagen';

    console.log('📋 Datos listos:', datos);

    mensaje.textContent = '✅ ¡Registro exitoso! Datos guardados.';
    mensaje.className = 'mensaje exito';

    // Aquí conectaremos con base de datos / WhatsApp
    if (typeof guardarEnBaseDatos === 'function') {
        guardarEnBaseDatos(formData);
    }
}
</script>
</body>
</html>
